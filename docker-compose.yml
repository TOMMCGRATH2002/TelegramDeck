# Local / single-server run: copy .env from .env.example first.
services:
  telegramdeck:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Must point inside the image — .env often has a host path like /root/.local/... which breaks Truth here
      TRUTHBRUSH_BIN: /app/.venv/bin/truthbrush
    volumes:
      - telegramdeck_data:/app/data
    restart: unless-stopped

volumes:
  telegramdeck_data:
